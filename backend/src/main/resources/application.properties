spring.application.name=businessflow

# Server
server.port=8080

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3307/businessflow_db
spring.datasource.username=businessflow
spring.datasource.password=${MYSQL_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true