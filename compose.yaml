services:
  mysql:
    image: mysql:8.4
    container_name: businessflow-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: businessflow_db
      MYSQL_USER: businessflow
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "127.0.0.1:3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: